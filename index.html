<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Home</h1>
    <div class="status">
      <span id="weather" class="weather"></span>
      <span id="clock"></span>
      <span id="conn" class="conn conn-connecting" title="Connecting…" aria-hidden="true"></span>
      <span id="conn-text" class="visually-hidden" role="status">Connecting…</span>
    </div>
  </header>
  <div id="error" class="error" role="alert"></div>
  <main id="grid" class="grid"></main>
  <div id="toast" class="toast" role="status"></div>
  <div id="saver" class="saver" hidden>
    <div id="saver-time" class="saver-time"></div>
    <div id="saver-date" class="saver-date"></div>
    <div id="saver-weather" class="saver-weather"></div>
  </div>
  <div id="sec" class="sec" hidden>
    <div id="sec-grid" class="sec-grid"></div>
    <div id="sec-bar" class="live-bar"><span>🛡️ Security</span><span>Tap a camera for live · tap here to close</span></div>
  </div>
  <div id="live" class="live" hidden>
    <img id="live-img" alt="">
    <div class="live-bar"><span id="live-name"></span><span>Tap to close</span></div>
    <div id="ptz-presets" class="ptz-presets"></div>
    <div id="ptz" class="ptz" hidden>
      <button type="button" data-dir="up" class="up" aria-label="Tilt up">▲</button>
      <button type="button" data-dir="left" class="left" aria-label="Pan left">◀</button>
      <button type="button" data-dir="right" class="right" aria-label="Pan right">▶</button>
      <button type="button" data-dir="down" class="down" aria-label="Tilt down">▼</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
